<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9d8d4">
<title>株式会社レンビス｜公式リンク</title>
<meta name="description" content="株式会社レンビスの公式リンクページ。建機用アタッチメントのレンタル・修理・販売・管理。">
<style>
:root{
  --text:#171717;
  --muted:#6b6b6b;
  --card:rgba(255,255,255,.88);
  --line:rgba(255,255,255,.72);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:
    radial-gradient(circle at 14% 12%,rgba(255,255,255,.72),transparent 34%),
    radial-gradient(circle at 88% 24%,rgba(255,255,255,.45),transparent 35%),
    linear-gradient(135deg,#d4d3cf 0%,#efeeeb 48%,#cfceca 100%);
  background-attachment:fixed;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    repeating-linear-gradient(15deg,rgba(0,0,0,.025) 0 1px,transparent 1px 8px),
    repeating-linear-gradient(105deg,rgba(255,255,255,.15) 0 1px,transparent 1px 11px);
}
.page{
  position:relative;
  width:min(100%,540px);
  margin:auto;
  padding:42px 18px 34px;
}
.hero{
  text-align:center;
  padding:14px 12px 25px;
}
.logo{
  display:block;
  width:min(100%,430px);
  height:auto;
  margin:0 auto;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.13));
}
.tagline{
  margin:24px auto 0;
  font-size:15px;
  font-weight:700;
  line-height:1.8;
  letter-spacing:.08em;
  text-shadow:0 1px 10px rgba(255,255,255,.8);
}
.links{display:grid;gap:14px}
.card{
  display:flex;
  align-items:center;
  min-height:82px;
  gap:15px;
  padding:15px 18px;
  color:var(--text);
  text-decoration:none;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 12px 28px rgba(0,0,0,.11),inset 0 1px 0 rgba(255,255,255,.65);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:transform .16s ease,box-shadow .16s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(0,0,0,.14)}
.card:active{transform:scale(.985)}
.icon{
  flex:0 0 46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:14px;
  font-size:23px;
  font-weight:800;
  background:#f2f2f2;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
}
.website .icon{background:#151515;color:white;font-size:18px}
.tiktok .icon{background:#050505;color:white}
.instagram .icon{
  color:white;
  background:radial-gradient(circle at 30% 105%,#ffd600 0 20%,#ff7a00 32%,#ff0169 58%,#d300c5 78%,#7638fa 100%);
}
.phone .icon{background:#e8f5ed;color:#167445}
.map .icon{background:#eef4ff}
.copy{min-width:0;flex:1}
.title{display:block;font-size:17px;font-weight:800;line-height:1.35}
.sub{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.5}
.arrow{font-size:26px;color:#8b8b8b;line-height:1}
footer{
  margin-top:27px;
  text-align:center;
  color:#747474;
  font-size:11px;
  letter-spacing:.08em;
}
@media(max-width:390px){
  .page{padding-top:27px}
  .hero{padding-bottom:20px}
  .tagline{margin-top:18px;font-size:14px}
  .card{min-height:76px;border-radius:18px;padding:13px 15px}
  .icon{flex-basis:42px;height:42px}
  .title{font-size:16px}
}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <img class="logo" src="renvis-logo.png" alt="renvis 株式会社レンビス">
    <p class="tagline">建機用アタッチメントの<br>レンタル・修理・販売・管理</p>
  </header>

  <section class="links" aria-label="公式リンク">
    <a class="card website" href="https://renvis.co.jp/" target="_blank" rel="noopener noreferrer">
      <span class="icon">R</span>
      <span class="copy"><span class="title">公式ホームページ</span><span class="sub">株式会社レンビス</span></span>
      <span class="arrow">›</span>
    </a>

    <a class="card tiktok" href="https://lite.tiktok.com/t/ZS9Mrt91CpgWw-OxUeo/" target="_blank" rel="noopener noreferrer">
      <span class="icon">♪</span>
      <span class="copy"><span class="title">TikTok</span><span class="sub">修理事例・入荷情報を発信中</span></span>
      <span class="arrow">›</span>
    </a>

    <a class="card instagram" href="https://www.instagram.com/renvisrenvis/" target="_blank" rel="noopener noreferrer">
      <span class="icon">◎</span>
      <span class="copy"><span class="title">Instagram</span><span class="sub">@renvisrenvis</span></span>
      <span class="arrow">›</span>
    </a>

    <a class="card phone" href="tel:0946428311">
      <span class="icon">☎</span>
      <span class="copy"><span class="title">電話でお問い合わせ</span><span class="sub">0946-42-8311</span></span>
      <span class="arrow">›</span>
    </a>

    <a class="card map" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%A0%AA%E5%BC%8F%E4%BC%9A%E7%A4%BE%E3%83%AC%E3%83%B3%E3%83%93%E3%82%B9%20%E3%83%AC%E3%83%B3%E3%82%BF%E3%83%AB%E3%83%A4%E3%83%BC%E3%83%89%20%E7%A6%8F%E5%B2%A1%E7%9C%8C%E6%9C%9D%E5%80%89%E9%83%A1%E7%AD%91%E5%89%8D%E7%94%BA%E6%9D%BE%E5%BB%B6807-3" target="_blank" rel="noopener noreferrer">
      <span class="icon">📍</span>
      <span class="copy"><span class="title">レンタルヤード</span><span class="sub">福岡県朝倉郡筑前町松延807-3<br>Googleマップを開く</span></span>
      <span class="arrow">›</span>
    </a>
  </section>

  <footer>© RENVIS Co., Ltd.</footer>
</main>
</body>
</html>
