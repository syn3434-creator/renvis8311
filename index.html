<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>株式会社レンビス｜公式リンク</title>
<meta name="description" content="株式会社レンビスの公式リンクページ。建機用アタッチメントのレンタル・修理・販売・管理。">
<style>
:root{
  --bg:#080808;
  --panel:#111;
  --line:#7a7a7a;
  --line-hi:#d3d3d3;
  --text:#f4f4f4;
  --muted:#a8a8a8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.08),transparent 36%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),
    linear-gradient(180deg,#171717 0%,#090909 46%,#050505 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(120deg,transparent 0 40%,rgba(255,255,255,.025) 48%,transparent 56%);
  opacity:.7;
}
.wrap{
  position:relative;
  width:min(100%,560px);
  margin:0 auto;
  padding:38px 20px calc(58px + env(safe-area-inset-bottom));
}
.hero{text-align:center;padding:4px 0 30px}
.logo{
  display:block;
  width:min(100%,500px);
  height:auto;
  margin:0 auto;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));
}
.catch{
  margin:21px 0 0;
  font-size:17px;
  line-height:1.75;
  font-weight:800;
  letter-spacing:.10em;
}
.service{
  margin:13px 0 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.75;
  letter-spacing:.055em;
}
.service strong{color:#eee;font-size:15px}
.links{display:grid;gap:13px}
.btn{
  position:relative;
  display:grid;
  grid-template-columns:46px 1fr 24px;
  align-items:center;
  gap:14px;
  min-height:82px;
  padding:16px 17px;
  color:var(--text);
  text-decoration:none;
  background:linear-gradient(180deg,#181818,#0e0e0e);
  border:1px solid var(--line);
  border-radius:0;
  overflow:hidden;
  transition:border-color .18s ease,background .18s ease,transform .18s ease;
}
.btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,transparent 0 40%,rgba(255,255,255,.09) 49%,transparent 58%);
  transform:translateX(-120%);
  transition:transform .45s ease;
}
.btn:hover{border-color:var(--line-hi);background:linear-gradient(180deg,#212121,#111)}
.btn:hover::before{transform:translateX(120%)}
.btn:active{transform:scale(.992)}
.icon{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:1px solid #777;
  background:#0b0b0b;
}
.icon svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:#e7e7e7;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.copy{min-width:0}
.title{display:block;font-size:16.5px;font-weight:760;line-height:1.35;letter-spacing:.025em}
.sub{display:block;margin-top:4px;color:#939393;font-size:12.5px;line-height:1.45}
.arrow{font-size:22px;color:#aaa;text-align:right}
footer{
  margin-top:30px;
  padding-top:20px;
  border-top:1px solid #2e2e2e;
  text-align:center;
  color:#666;
  font-size:11px;
  letter-spacing:.09em;
}
@media(max-width:390px){
  .wrap{padding-top:28px}
  .hero{padding-bottom:26px}
  .catch{font-size:15px}
  .service{font-size:13px}
  .btn{grid-template-columns:42px 1fr 20px;min-height:78px;padding:14px}
  .icon{width:38px;height:38px}
  .title{font-size:16px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <img class="logo" src="renvis-logo-silver.png" alt="renvis 株式会社レンビス">
    <p class="catch">建設・解体現場を支える<br>アタッチメントのプロフェッショナル</p>
    <p class="service">建機用アタッチメントの<br><strong>レンタル・修理・販売・管理</strong></p>
  </header>

  <section class="links" aria-label="公式リンク">
    <a class="btn" href="https://renvis.co.jp/" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.6 3.7 5.7 3.7 9S14.4 18.4 12 21C9.6 18.4 8.3 15.3 8.3 12S9.6 5.6 12 3z"/></svg>
      </span>
      <span class="copy"><span class="title">公式ホームページ</span><span class="sub">株式会社レンビス</span></span>
      <span class="arrow">→</span>
    </a>

    <a class="btn" href="https://lite.tiktok.com/t/ZS9Mrt91CpgWw-OxUeo/" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M14 4v10.2a4 4 0 1 1-3.3-3.95"/><path d="M14 4c1.1 2.5 2.8 3.8 5 4"/></svg>
      </span>
      <span class="copy"><span class="title">TikTok</span><span class="sub">修理事例・入荷情報を発信中</span></span>
      <span class="arrow">→</span>
    </a>

    <a class="btn" href="https://www.instagram.com/renvisrenvis/" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.2" cy="6.8" r=".7" fill="#e7e7e7" stroke="none"/></svg>
      </span>
      <span class="copy"><span class="title">Instagram</span><span class="sub">@renvisrenvis</span></span>
      <span class="arrow">→</span>
    </a>

    <a class="btn" href="tel:0946428311">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6.8 4.8 9.2 8l-1.6 2a15.5 15.5 0 0 0 6.4 6.4l2-1.6 3.2 2.4-1 2.7c-.3.8-1.1 1.3-2 1.1C9.3 19.7 4.3 14.7 3 7.8c-.2-.9.3-1.7 1.1-2z"/></svg>
      </span>
      <span class="copy"><span class="title">電話でお問い合わせ</span><span class="sub">0946-42-8311</span></span>
      <span class="arrow">→</span>
    </a>

    <a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%A0%AA%E5%BC%8F%E4%BC%9A%E7%A4%BE%E3%83%AC%E3%83%B3%E3%83%93%E3%82%B9%20%E3%83%AC%E3%83%B3%E3%82%BF%E3%83%AB%E3%83%A4%E3%83%BC%E3%83%89%20%E7%A6%8F%E5%B2%A1%E7%9C%8C%E6%9C%9D%E5%80%89%E9%83%A1%E7%AD%91%E5%89%8D%E7%94%BA%E6%9D%BE%E5%BB%B6807-3" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></svg>
      </span>
      <span class="copy"><span class="title">レンタルヤード</span><span class="sub">福岡県朝倉郡筑前町松延807-3</span></span>
      <span class="arrow">→</span>
    </a>
  </section>

  <footer>© RENVIS Co., Ltd.</footer>
</main>
</body>
</html>
