<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d9d9d9">
  <meta name="description" content="株式会社レンビス 公式リンクページ">
  <title>株式会社レンビス | Official Links</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root{
      --text:#20242a;
      --muted:#73777d;
      --card:rgba(255,255,255,.95);
      --shadow:0 14px 34px rgba(0,0,0,.14);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      padding:28px 12px 30px;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
                  "Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic",
                  "Noto Sans JP",sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),
        url("background.jpg") center top / cover fixed no-repeat;
    }

    .page{
      width:min(100%,620px);
      margin:0 auto;
    }

    .hero{
      text-align:center;
      padding:0 8px 24px;
    }

    .logo{
      width:min(100%,520px);
      margin:0 auto 18px;
      padding:14px 18px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(255,255,255,.84);
      border-radius:18px;
      box-shadow:0 10px 28px rgba(0,0,0,.10);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .logo img{
      display:block;
      width:100%;
      height:auto;
    }

    .tagline{
      margin:0;
      font-size:clamp(14px,3.8vw,17px);
      line-height:1.8;
      font-weight:700;
      letter-spacing:.05em;
      text-shadow:0 1px 0 rgba(255,255,255,.9);
    }

    .links{
      display:grid;
      gap:14px;
    }

    .card{
      display:grid;
      grid-template-columns:64px 1fr 24px;
      align-items:center;
      gap:16px;
      min-height:92px;
      padding:15px 20px;
      text-decoration:none;
      color:var(--text);
      background:var(--card);
      border:1px solid rgba(255,255,255,.94);
      border-radius:22px;
      box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
    }

    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 18px 40px rgba(0,0,0,.18);
    }

    .card:active{transform:translateY(0)}

    .icon{
      width:58px;
      height:58px;
      display:grid;
      place-items:center;
      border-radius:17px;
      font-size:29px;
      background:#fff;
      box-shadow:0 6px 16px rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.04);
    }

    .website{color:#2477e6}
    .phone{color:#2db45d}
    .maps{color:#ea4335}

    .tiktok{
      color:#111;
      text-shadow:-2px 0 #25f4ee,2px 0 #fe2c55;
    }

    .instagram{
      color:#fff;
      background:
        radial-gradient(circle at 30% 110%,#fdf497 0 10%,transparent 30%),
        radial-gradient(circle at 70% 80%,#fd5949 0 26%,#d6249f 50%,#285aeb 80%);
    }

    .title{
      display:block;
      font-size:clamp(18px,4.7vw,24px);
      font-weight:800;
      letter-spacing:.01em;
    }

    .sub{
      display:block;
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
      font-weight:600;
      line-height:1.45;
    }

    .arrow{
      color:#8b8f94;
      font-size:22px;
      text-align:right;
    }

    footer{
      padding:32px 8px 4px;
      text-align:center;
      color:#666;
      font-size:12px;
      letter-spacing:.08em;
      text-shadow:0 1px 0 rgba(255,255,255,.9);
    }

    .company{
      display:block;
      margin-bottom:6px;
      font-size:14px;
      color:#555;
    }

    @media(max-width:460px){
      body{padding:20px 10px 24px}
      .logo{padding:11px 13px;border-radius:15px}
      .card{
        grid-template-columns:54px 1fr 20px;
        gap:12px;
        min-height:80px;
        padding:12px 15px;
        border-radius:18px;
      }
      .icon{
        width:50px;
        height:50px;
        border-radius:15px;
        font-size:25px;
      }
      .title{font-size:18px}
      .sub{font-size:12px}
      .arrow{font-size:19px}
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <div class="logo">
        <img src="renvis-logo.jpg" alt="株式会社レンビス RENVIS ロゴ">
      </div>
      <p class="tagline">建機用アタッチメントの<br>レンタル・修理・販売・管理</p>
    </header>

    <section class="links" aria-label="公式リンク">
      <a class="card" href="https://renvis.co.jp/" target="_blank" rel="noopener noreferrer">
        <span class="icon website"><i class="fa-solid fa-globe"></i></span>
        <span>
          <span class="title">Official Website</span>
          <span class="sub">公式ホームページ</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="card" href="https://lite.tiktok.com/t/ZS9Mrt91CpgWw-OxUeo/" target="_blank" rel="noopener noreferrer">
        <span class="icon tiktok"><i class="fa-brands fa-tiktok"></i></span>
        <span>
          <span class="title">TikTok</span>
          <span class="sub">公式TikTok</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="card" href="https://www.instagram.com/renvisrenvis?igsh=MW0ybzBxNTJ4ZWdoaQ==" target="_blank" rel="noopener noreferrer">
        <span class="icon instagram"><i class="fa-brands fa-instagram"></i></span>
        <span>
          <span class="title">Instagram</span>
          <span class="sub">公式Instagram</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="card" href="tel:0946428311">
        <span class="icon phone"><i class="fa-solid fa-phone"></i></span>
        <span>
          <span class="title">電話する</span>
          <span class="sub">0946-42-8311</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="card"
         href="https://www.google.com/maps/search/?api=1&query=%E7%A6%8F%E5%B2%A1%E7%9C%8C%E6%9C%9D%E5%80%89%E9%83%A1%E7%AD%91%E5%89%8D%E7%94%BA%E6%9D%BE%E5%BB%B6807-3"
         target="_blank" rel="noopener noreferrer">
        <span class="icon maps"><i class="fa-solid fa-location-dot"></i></span>
        <span>
          <span class="title">レンタルヤード</span>
          <span class="sub">福岡県朝倉郡筑前町松延807-3</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>
    </section>

    <footer>
      <span class="company">株式会社レンビス</span>
      © RENVIS. All Rights Reserved.
    </footer>
  </main>
</body>
</html>
