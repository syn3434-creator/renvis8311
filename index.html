<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d4d3cf">
<title>株式会社レンビス｜公式リンク</title>
<meta name="description" content="株式会社レンビスの公式リンクページ。建機用アタッチメントのレンタル・修理・販売・管理。">
<style>
:root{
  --ink:#171717;
  --muted:#696969;
  --glass:rgba(255,255,255,.78);
  --glass-strong:rgba(248,248,248,.90);
  --edge:rgba(255,255,255,.72);
  --shadow:0 16px 34px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:
    radial-gradient(circle at 16% 8%,rgba(255,255,255,.76),transparent 30%),
    radial-gradient(circle at 86% 26%,rgba(255,255,255,.46),transparent 34%),
    linear-gradient(140deg,#c8c7c3 0%,#ecebe7 48%,#c7c6c2 100%);
  background-attachment:fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  opacity:.20;
  background-image:
    repeating-linear-gradient(12deg,rgba(0,0,0,.035) 0 1px,transparent 1px 9px),
    repeating-linear-gradient(102deg,rgba(255,255,255,.20) 0 1px,transparent 1px 12px);
}
.page{
  width:min(100%,550px);
  margin:0 auto;
  padding:32px 18px calc(56px + env(safe-area-inset-bottom));
}
.hero{
  text-align:center;
  padding:4px 6px 25px;
}
.logo{
  display:block;
  width:min(100%,470px);
  height:auto;
  margin:0 auto;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.13));
}
.catch{
  margin:20px auto 0;
  font-size:16px;
  font-weight:800;
  line-height:1.7;
  letter-spacing:.075em;
}
.service{
  margin:12px auto 0;
  color:#4f4f4f;
  font-size:14px;
  line-height:1.75;
  letter-spacing:.055em;
}
.service strong{
  color:#1c1c1c;
  font-size:15px;
  font-weight:850;
}
.links{
  display:grid;
  gap:14px;
}
.card{
  display:flex;
  align-items:center;
  gap:15px;
  min-height:88px;
  padding:16px 18px;
  color:var(--ink);
  text-decoration:none;
  background:
    linear-gradient(145deg,rgba(255,255,255,.91),rgba(232,232,232,.76));
  border:1px solid var(--edge);
  border-radius:18px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:transform .16s ease,box-shadow .16s ease;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 40px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.9);
}
.card:active{transform:scale(.985)}
.icon{
  flex:0 0 48px;
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(145deg,#242424,#080808);
  color:white;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 14px rgba(0,0,0,.16);
}
.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.copy{min-width:0;flex:1}
.title{
  display:block;
  font-size:17px;
  font-weight:820;
  line-height:1.35;
}
.sub{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:12.5px;
  line-height:1.5;
}
.arrow{
  color:#777;
  font-size:24px;
  line-height:1;
}
footer{
  margin-top:30px;
  text-align:center;
  color:#707070;
  font-size:11px;
  letter-spacing:.08em;
}
@media(max-width:390px){
  .page{padding-top:23px}
  .hero{padding-bottom:21px}
  .logo{width:min(100%,455px)}
  .catch{margin-top:16px;font-size:15px}
  .service{font-size:13px}
  .service strong{font-size:14px}
  .card{min-height:82px;padding:14px 15px;border-radius:16px}
  .icon{flex-basis:44px;width:44px;height:44px}
  .title{font-size:16px}
}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <img class="logo" src="renvis-logo.png" alt="renvis 株式会社レンビス">
    <p class="catch">建設・解体現場を支える<br>アタッチメントのプロフェッショナル</p>
    <p class="service">建機用アタッチメントの<br><strong>レンタル・修理・販売・管理</strong></p>
  </header>

  <section class="links" aria-label="公式リンク">

      </span>
      <span class="copy"><span class="title">公式ホームページ</span><span class="sub">株式会社レンビス</span></span>

        <svg viewBox="0 0 24 24"><path d="M14 4v10.2a4 4 0 1 1-3.3-3.95"/><path d="M14 4c1.1 2.5 2.7 3.8 5 4"/></svg>
      </span>
      <span class="copy"><span class="title">TikTok</span><span class="sub">修理事例・入荷情報を発信中</span></span>
      <span class="arrow">›</span>
    </a>

    <a class="card" href="https://www.instagram.com/renvisrenvis/" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.3" cy="6.8" r=".8" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="copy"><span class="title">Instagram</span><span class="sub">@renvisrenvis</span></span>
      <span class="arrow">›</span>
    </a>

    <a class="card" href="tel:0946428311">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6.8 4.8 9.2 8l-1.6 2a15.5 15.5 0 0 0 6.4 6.4l2-1.6 3.2 2.4-1 2.7c-.3.8-1.1 1.3-2 1.1C9.3 19.7 4.3 14.7 3 7.8c-.2-.9.3-1.7 1.1-2z"/></svg>
      </span>
      <span class="copy"><span class="title">電話でお問い合わせ</span><span class="sub">0946-42-8311</span></span>
      <span class="arrow">›</span>
    </a>

    <a class="card" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%A0%AA%E5%BC%8F%E4%BC%9A%E7%A4%BE%E3%83%AC%E3%83%B3%E3%83%93%E3%82%B9%20%E3%83%AC%E3%83%B3%E3%82%BF%E3%83%AB%E3%83%A4%E3%83%BC%E3%83%89%20%E7%A6%8F%E5%B2%A1%E7%9C%8C%E6%9C%9D%E5%80%89%E9%83%A1%E7%AD%91%E5%89%8D%E7%94%BA%E6%9D%BE%E5%BB%B6807-3" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></svg>
      </span>
      <span class="copy"><span class="title">レンタルヤード</span><span class="sub">福岡県朝倉郡筑前町松延807-3<br>Googleマップを開く</span></span>
      <span class="arrow">›</span>
    </a>
  </section>

  <footer>© RENVIS Co., Ltd.</footer>
</main>
</body>
</html>
