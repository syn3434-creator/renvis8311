<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d8d8d8">
  <meta name="description" content="株式会社レンビス 公式リンクページ">
  <title>株式会社レンビス | Official Links</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root{
      --text:#171717;
      --muted:#747474;
      --card:rgba(255,255,255,.94);
      --shadow:0 12px 30px rgba(0,0,0,.16);
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      padding:clamp(22px,5vw,54px) 14px 36px;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
                  "Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic",
                  "Noto Sans JP",sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.14)),
        url("background.jpg") center top / cover fixed no-repeat;
    }

    .page{
      width:min(100%,680px);
      margin:0 auto;
    }

    .hero{
      text-align:center;
      padding:10px 12px 24px;
    }

    .logo{
      width:min(100%,430px);
      margin:0 auto 18px;
      padding:10px;
      background:#fff;
      box-shadow:0 8px 24px rgba(0,0,0,.10);
    }

    .logo img{
      display:block;
      width:100%;
      height:auto;
    }

    .tagline{
      margin:0;
      font-size:clamp(13px,3.7vw,16px);
      line-height:1.75;
      font-weight:700;
      letter-spacing:.05em;
      text-shadow:0 1px 0 rgba(255,255,255,.75);
    }

    .links{
      display:grid;
      gap:12px;
    }

    .link{
      display:grid;
      grid-template-columns:54px 1fr 22px;
      align-items:center;
      gap:14px;
      min-height:78px;
      padding:13px 17px;
      color:var(--text);
      text-decoration:none;
      background:var(--card);
      border:1px solid rgba(255,255,255,.92);
      box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
    }

    .link:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 34px rgba(0,0,0,.19);
    }

    .link:active{transform:translateY(0)}

    .icon{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      border-radius:13px;
      font-size:25px;
      background:#fff;
    }

    .website{color:#1877f2}
    .phone{color:#23b45d}
    .map{color:#ea4335}

    .tiktok{
      color:#111;
      text-shadow:-2px 0 #25f4ee,2px 0 #fe2c55;
    }

    .instagram{
      color:#fff;
      background:
        radial-gradient(circle at 30% 110%,#fdf497 0 10%,transparent 30%),
        radial-gradient(circle at 70% 80%,#fd5949 0 26%,#d6249f 50%,#285aeb 80%);
    }

    .title{
      display:block;
      font-size:clamp(16px,4.4vw,20px);
      font-weight:800;
      letter-spacing:.01em;
    }

    .sub{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
      line-height:1.45;
    }

    .arrow{
      color:#888;
      font-size:19px;
      text-align:right;
    }

    footer{
      padding:30px 8px 4px;
      text-align:center;
      color:#666;
      font-size:11px;
      letter-spacing:.06em;
      text-shadow:0 1px 0 rgba(255,255,255,.8);
    }

    @media(max-width:460px){
      body{padding-left:10px;padding-right:10px}
      .hero{padding-left:4px;padding-right:4px}
      .link{
        grid-template-columns:49px 1fr 18px;
        gap:11px;
        min-height:72px;
        padding:11px 13px;
      }
      .icon{width:44px;height:44px;font-size:23px}
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <div class="logo">
        <img src="renvis-logo.jpg" alt="株式会社レンビス RENVIS ロゴ">
      </div>
      <p class="tagline">建機用アタッチメントの<br>レンタル・修理・販売・管理</p>
    </header>

    <section class="links" aria-label="公式リンク">
      <a class="link" href="https://renvis.co.jp/" target="_blank" rel="noopener noreferrer">
        <span class="icon website"><i class="fa-solid fa-globe"></i></span>
        <span>
          <span class="title">Official Website</span>
          <span class="sub">公式ホームページ</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link" href="https://lite.tiktok.com/t/ZS9Mrt91CpgWw-OxUeo/" target="_blank" rel="noopener noreferrer">
        <span class="icon tiktok"><i class="fa-brands fa-tiktok"></i></span>
        <span>
          <span class="title">TikTok</span>
          <span class="sub">公式TikTok</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link" href="https://www.instagram.com/renvisrenvis?igsh=MW0ybzBxNTJ4ZWdoaQ==" target="_blank" rel="noopener noreferrer">
        <span class="icon instagram"><i class="fa-brands fa-instagram"></i></span>
        <span>
          <span class="title">Instagram</span>
          <span class="sub">公式Instagram</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link" href="tel:0946428311">
        <span class="icon phone"><i class="fa-solid fa-phone"></i></span>
        <span>
          <span class="title">電話する</span>
          <span class="sub">0946-42-8311</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link"
         href="https://www.google.com/maps/search/?api=1&query=%E7%A6%8F%E5%B2%A1%E7%9C%8C%E6%9C%9D%E5%80%89%E9%83%A1%E7%AD%91%E5%89%8D%E7%94%BA%E6%9D%BE%E5%BB%B6807-3"
         target="_blank" rel="noopener noreferrer">
        <span class="icon map"><i class="fa-solid fa-location-dot"></i></span>
        <span>
          <span class="title">レンタルヤード</span>
          <span class="sub">福岡県朝倉郡筑前町松延807-3</span>
        </span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>
    </section>

    <footer>© RENVIS. All Rights Reserved.</footer>
  </main>
</body>
</html>
