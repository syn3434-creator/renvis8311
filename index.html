<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>株式会社レンビス｜公式リンク</title>
  <meta name="description" content="株式会社レンビス公式リンク。建機用アタッチメントのレンタル・修理・販売・管理。">

  <style>
    :root{
      --bg:#050505;
      --text:#f7f7f7;
      --muted:#aaa;
      --line:#8c8c8c;
    }

    *{box-sizing:border-box}

    html{
      scroll-behavior:smooth;
      background:#050505;
    }

    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",
        "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
      background:
        radial-gradient(circle at 50% -8%,rgba(255,255,255,.09),transparent 32%),
        repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px),
        linear-gradient(180deg,#171717 0%,#090909 43%,#030303 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(115deg,transparent 0 43%,rgba(255,255,255,.025) 49%,transparent 55%),
        radial-gradient(circle at 85% 12%,rgba(255,255,255,.05),transparent 18%);
    }

    .shell{
      position:relative;
      width:min(100%,570px);
      margin:0 auto;
      padding:30px 18px calc(54px + env(safe-area-inset-bottom));
    }

    .hero{
      padding:2px 4px 27px;
      text-align:center;
      animation:heroIn .65s ease both;
    }

    .logo{
      display:block;
      width:min(100%,510px);
      height:auto;
      margin:0 auto;
      filter:drop-shadow(0 13px 24px rgba(0,0,0,.62));
    }

    .catch{
      margin:24px auto 0;
      max-width:520px;
      text-align:center;
    }

    .catch-top{
      display:block;
      color:#d2d2d2;
      font-size:clamp(14px,3.7vw,17px);
      font-weight:700;
      letter-spacing:.18em;
      line-height:1.5;
      text-shadow:0 2px 7px rgba(0,0,0,.9);
    }

    .catch-main{
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-top:8px;
      font-size:clamp(22px,6.1vw,28px);
      font-weight:900;
      letter-spacing:.025em;
      line-height:1.18;
      background:linear-gradient(180deg,#fff 0%,#dedede 45%,#8b8b8b 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      filter:drop-shadow(0 4px 4px rgba(0,0,0,.9));
    }

    .catch-main span{display:block}

    .service{
      position:relative;
      margin:24px auto 0;
      max-width:470px;
      padding-top:18px;
      color:#b7b7b7;
      font-size:clamp(13px,3.6vw,15px);
      line-height:1.55;
      letter-spacing:.12em;
      text-align:center;
    }

    .service::before{
      content:"";
      position:absolute;
      top:0;
      left:12%;
      right:12%;
      height:1px;
      background:linear-gradient(90deg,transparent,#777 22%,#d6d6d6 50%,#777 78%,transparent);
      box-shadow:0 0 8px rgba(255,255,255,.18);
    }

    .service strong{
      display:block;
      margin-top:9px;
      color:#f4f4f4;
      font-size:clamp(16px,4.6vw,21px);
      font-weight:900;
      letter-spacing:.13em;
      text-shadow:0 3px 7px rgba(0,0,0,.85);
    }

    .links{
      display:grid;
      gap:13px;
    }

    .card{
      position:relative;
      display:grid;
      grid-template-columns:50px 1fr 24px;
      align-items:center;
      gap:15px;
      min-height:88px;
      padding:15px 17px;
      color:#fff;
      text-decoration:none;
      background:
        linear-gradient(180deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 4%,transparent 12%),
        linear-gradient(180deg,rgba(40,40,40,.98) 0%,rgba(20,20,20,.98) 50%,rgba(9,9,9,.99) 100%),
        repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 4px);
      border:1px solid var(--line);
      border-radius:0;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -1px 0 rgba(0,0,0,.9),
        0 8px 18px rgba(0,0,0,.28);
      overflow:hidden;
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,filter .22s ease;
      opacity:0;
      transform:translateY(10px);
      animation:cardIn .5s cubic-bezier(.2,.7,.2,1) forwards;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(110deg,transparent 0 39%,rgba(255,255,255,.15) 50%,transparent 61%);
      transform:translateX(-135%);
      transition:transform .58s cubic-bezier(.2,.7,.2,1);
    }

    .card:nth-child(1){animation-delay:.10s}
    .card:nth-child(2){animation-delay:.17s}
    .card:nth-child(3){animation-delay:.24s}
    .card:nth-child(4){animation-delay:.31s}
    .card:nth-child(5){animation-delay:.38s}

    .card:hover{
      transform:translateY(-2px);
      border-color:#dedede;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -1px 0 rgba(0,0,0,.95),
        0 13px 27px rgba(0,0,0,.40);
      filter:brightness(1.04);
    }

    .card:hover::before{transform:translateX(135%)}

    .card:active{
      transform:translateY(1px) scale(.995);
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,.65),
        0 5px 12px rgba(0,0,0,.28);
    }

    .icon{
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
    }

    .icon svg{
      width:36px;
      height:36px;
    }

    .copy{min-width:0}

    .title{
      display:block;
      font-size:17px;
      font-weight:800;
      line-height:1.35;
      letter-spacing:.02em;
    }

    .sub{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:12.5px;
      line-height:1.45;
    }

    .arrow{
      color:#ddd;
      font-size:27px;
      line-height:1;
      text-align:right;
      transition:transform .22s ease,color .22s ease;
    }

    .card:hover .arrow{
      transform:translateX(4px);
      color:#fff;
    }

    footer{
      margin-top:28px;
      padding-top:19px;
      border-top:1px solid #2d2d2d;
      text-align:center;
      color:#676767;
      font-size:11px;
      letter-spacing:.09em;
    }

    @keyframes heroIn{
      from{opacity:0;transform:translateY(-8px)}
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes cardIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    @media(max-width:390px){
      .shell{padding-top:25px}
      .hero{padding-bottom:24px}
      .logo{width:100%}
      .catch-main{font-size:clamp(21px,6vw,25px)}
      .card{
        grid-template-columns:46px 1fr 20px;
        min-height:82px;
        padding:14px;
      }
      .icon{width:40px;height:40px}
      .icon svg{width:33px;height:33px}
      .title{font-size:16px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .card{opacity:1;transform:none}
    }
  </style>

</head>

<body>

  <script>
    document.querySelectorAll('[data-track]').forEach(function(link) {
      link.addEventListener('click', function() {
        if (typeof gtag === 'function') {
          gtag('event', 'link_click', {
            link_name: this.dataset.track,
            link_url: this.href

        }
      });
    });
