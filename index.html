<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d7d7d7">
  <meta name="description" content="株式会社レンビス 公式リンクページ">
  <title>株式会社レンビス | Official Links</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root{
      --text:#181818;
      --muted:#767676;
      --card:rgba(255,255,255,.93);
      --shadow:0 12px 30px rgba(0,0,0,.13);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      padding:28px 12px 28px;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
                  "Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic",
                  "Noto Sans JP",sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,.10)),
        url("background.jpg") center top / cover fixed no-repeat;
    }

    .page{
      width:min(100%,560px);
      margin:0 auto;
    }

    .hero{
      text-align:center;
      padding:0 6px 22px;
    }

    .logo-wrap{
      width:min(100%,500px);
      margin:0 auto 14px;
      padding:10px 14px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(255,255,255,.92);
      border-radius:12px;
      box-shadow:0 10px 26px rgba(0,0,0,.10);
    }

    .logo-wrap img{
      display:block;
      width:100%;
      height:auto;
    }

    .tagline{
      margin:0;
      font-size:14px;
      line-height:1.7;
      font-weight:700;
      letter-spacing:.04em;
      text-shadow:0 1px 0 rgba(255,255,255,.86);
    }

    .links{
      display:grid;
      gap:12px;
    }

    .link-card{
      display:grid;
      grid-template-columns:50px 1fr 20px;
      align-items:center;
      gap:13px;
      min-height:74px;
      padding:12px 15px;
      color:var(--text);
      text-decoration:none;
      background:var(--card);
      border:1px solid rgba(255,255,255,.92);
      border-radius:15px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      transition:transform .18s ease,box-shadow .18s ease;
    }

    .link-card:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 34px rgba(0,0,0,.17);
    }

    .icon{
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      border-radius:12px;
      font-size:24px;
      background:#fff;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
    }

    .website{color:#1877f2}
    .phone{color:#22b45d}
    .maps{color:#ea4335}

    .tiktok{
      color:#111;
      text-shadow:-2px 0 #25f4ee,2px 0 #fe2c55;
    }

    .instagram{
      color:#fff;
      background:
        radial-gradient(circle at 30% 110%,#fdf497 0 10%,transparent 30%),
        radial-gradient(circle at 70% 80%,#fd5949 0 26%,#d6249f 50%,#285aeb 80%);
    }

    .title{
      display:block;
      font-size:18px;
      font-weight:800;
      letter-spacing:.01em;
    }

    .sub{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
      line-height:1.4;
    }

    .arrow{
      color:#8a8a8a;
      font-size:18px;
      text-align:right;
    }

    footer{
      padding:28px 8px 4px;
      text-align:center;
      color:#666;
      font-size:11px;
      letter-spacing:.06em;
      text-shadow:0 1px 0 rgba(255,255,255,.85);
    }

    @media(max-width:460px){
      body{padding:20px 10px 24px}
      .logo-wrap{padding:9px 11px}
      .link-card{
        grid-template-columns:46px 1fr 18px;
        gap:11px;
        min-height:70px;
        padding:11px 13px;
      }
      .icon{width:42px;height:42px;font-size:22px}
      .title{font-size:17px}
      .tagline{font-size:13px}
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <div class="logo-wrap">
        <img src="renvis-logo.jpg" alt="株式会社レンビス RENVIS ロゴ">
      </div>
      <p class="tagline">建機用アタッチメントの<br>レンタル・修理・販売・管理</p>
    </header>

    <section class="links" aria-label="公式リンク">
      <a class="link-card" href="https://renvis.co.jp/" target="_blank" rel="noopener noreferrer">
        <span class="icon website"><i class="fa-solid fa-globe"></i></span>
        <span><span class="title">Official Website</span><span class="sub">公式ホームページ</span></span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link-card" href="https://lite.tiktok.com/t/ZS9Mrt91CpgWw-OxUeo/" target="_blank" rel="noopener noreferrer">
        <span class="icon tiktok"><i class="fa-brands fa-tiktok"></i></span>
        <span><span class="title">TikTok</span><span class="sub">公式TikTok</span></span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link-card" href="https://www.instagram.com/renvisrenvis?igsh=MW0ybzBxNTJ4ZWdoaQ==" target="_blank" rel="noopener noreferrer">
        <span class="icon instagram"><i class="fa-brands fa-instagram"></i></span>
        <span><span class="title">Instagram</span><span class="sub">公式Instagram</span></span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link-card" href="tel:0946428311">
        <span class="icon phone"><i class="fa-solid fa-phone"></i></span>
        <span><span class="title">電話する</span><span class="sub">0946-42-8311</span></span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link-card"
         href="https://www.google.com/maps/search/?api=1&query=%E7%A6%8F%E5%B2%A1%E7%9C%8C%E6%9C%9D%E5%80%89%E9%83%A1%E7%AD%91%E5%89%8D%E7%94%BA%E6%9D%BE%E5%BB%B6807-3"
         target="_blank" rel="noopener noreferrer">
        <span class="icon maps"><i class="fa-solid fa-location-dot"></i></span>
        <span><span class="title">レンタルヤード</span><span class="sub">福岡県朝倉郡筑前町松延807-3</span></span>
        <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>
    </section>

    <footer>© RENVIS. All Rights Reserved.</footer>
  </main>
</body>
</html>
